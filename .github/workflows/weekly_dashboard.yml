name: Weekly Support Dashboard

on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run dashboard pipeline
        env:
          FRESHDESK_API_KEY:  ${{ secrets.FRESHDESK_API_KEY }}
          FRESHDESK_DOMAIN:   ${{ secrets.FRESHDESK_DOMAIN }}
          SMTP_FROM:          ${{ secrets.SMTP_FROM }}
          SMTP_TO:            ${{ secrets.SMTP_TO }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          GITHUB_REPO_OWNER:  ${{ github.repository_owner }}
          GITHUB_REPO_NAME:   ${{ github.event.repository.name }}
        run: python run.py
      - name: Commit & push updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: weekly dashboard update $(date +'%Y-%m-%d')"
          git push
